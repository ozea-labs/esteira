schema: spec-driven

# Ozea rules for the spec-driven factory (OPS-67). This is the only OpenSpec
# file we edit by hand: everything under .agents/skills/ is regenerated by
# `bin/openspec update`. These rules only guide the agent; the blocking checks
# are scripts/spec/*.mjs in CI (see docs/spec-process.md).

context: |
  Facilita Pix Receivables: B2B receivables API (Symfony 7.4, PHP 8.4, Doctrine ORM 3, PostgreSQL 16, Symfony Messenger as outbox).
  Run the OpenSpec CLI as a plain `openspec ...` command, one command per call (it is on PATH through bin/openspec); never call it through tools/openspec/node_modules, node, or a compound shell line.
  Write every OpenSpec artifact in English; requirement text uses SHALL/MUST.
  The source of truth for a change is a Jira ticket whose examples (EX-1, EX-2, ...) were approved by the product owner. Never invent behavior that no example asks for; an ambiguity that changes observable behavior or architecture is recorded under "Open questions" in proposal.md instead of being decided.
  Architectural red lines (docs/adr/0001..0006, 0011, 0012): the domain mirrors the Bacen COBV schema, not PSP JSON; seller_id is the internal business key; penalty and interest are recalculated in the domain; the Bacen txid is the idempotency key; SettlementEvent is separate from Payment; credit bureaus sit behind a port; the app never calls Kratos (Oathkeeper injects X-User-* headers); Doctrine mapping lives only in src/Infrastructure.
  Deadlines and amounts come from SellerConfiguration/DebtorConfiguration, never hardcoded.
  Acceptance tests live in tests/Acceptance/<ChangeInPascalCase>/ and are written by a separate agent from proposal.md and the delta specs only. Unit and functional tests live in tests/Unit and tests/Functional.

rules:
  proposal:
    - >-
      Start with the Jira key of the ticket in the first line of "## Why" (for example "Jira: FP-123").
    - >-
      Add a "## Examples" section right after "## Why" that copies every approved example from the ticket as "- EX-n: <text>", keeping the ticket's numbering. Do not add, merge or reword examples.
    - >-
      If the ticket carries an approved architecture decision, list it under "## Impact" as "ADR: <title>" so the factory writes the ADR in docs/adr/.
    - >-
      List any ambiguity that would change observable behavior or architecture under "## Open questions"; leave the section out when there is none.
  specs:
    - >-
      Name every scenario "#### Scenario: RCV-<CAPABILITY>-<NNN> <short title>", where CAPABILITY is 2-12 uppercase letters or digits naming the capability and NNN is a three-digit number. IDs are unique across the repository and never reused; a MODIFIED scenario keeps its ID.
    - >-
      The first bullet of every scenario is "- **Origin**: EX-n" (comma-separated when several examples back it). Every EX in proposal.md has at least one scenario; a scenario with no example is new scope and goes to "## Open questions" instead.
    - >-
      When design.md marks security as applicable, add at least one negative scenario per applicable control (rejected authentication, wrong tenant, invalid signature, oversized or malformed input) and mark it with the bullet "- **Security**: negative" right after Origin.
    - >-
      Each scenario is testable through the public HTTP API, a console command or a message handler; avoid internal class names.
  design:
    - >-
      Always create design.md, with a "## Security" section whose first bullet is "- **Applies**: yes" or "- **Applies**: no - <reason>".
    - >-
      When security applies, cover each item of the Ozea application-security baseline that the change touches - trust boundaries; authentication, authorization, tenant and field ownership; CSRF; media type, size and resource limits; query binding; output escaping, cache, CORS and headers; safe errors and logging - and name the negative scenario ID that tests it, or the follow-up ticket when a non-critical control is deferred.
    - >-
      Record transaction and idempotency strategy (txid, Messenger outbox) and schema constraints when persistence changes.
  tasks:
    - >-
      Never schedule edits to proposal.md, specs/**, tests/Acceptance/** or .spec-lock.json; those are locked once the acceptance tests are committed.
    - >-
      End with a task that runs the local quality gate (php-cs-fixer, phpstan, phpunit, make spec-validate).

operations:
  apply:
    guidance:
      - >-
        Do not modify proposal.md, specs/**, design.md security section, tests/Acceptance/** or .spec-lock.json of the change; if a scenario looks wrong, stop and report it instead of editing.
      - >-
        Make the acceptance tests in tests/Acceptance/<Change>/ pass by changing production code, never by changing the tests.
  archive:
    guidance:
      - >-
        Archive with `bin/openspec archive <change> --yes --json` as the last commit of the pull request, after every task is checked.
